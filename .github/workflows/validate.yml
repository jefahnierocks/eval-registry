name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry-local-validation:
    name: registry-local-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub event revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install exact validation tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-cache
        with:
          version: 2026.10.1
          install_args: python uv gitleaks
          cache: false
          mise_dir: ${{ runner.temp }}/mise
          wings_enabled: false

      - name: Install hash-locked validation dependency
        env:
          UV_CACHE_DIR: .cache/uv
        run: |
          uv venv --python 3.13.15 .venv
          uv pip sync --python .venv/bin/python --require-hashes requirements-dev.txt

      - name: Run canonical offline validation
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          bash scripts/run-validation.sh

      - name: Validate exact-head solo-maintainer attestation
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate_pr_attestation.py "$GITHUB_EVENT_PATH"

      - name: Enforce immutable history in pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_append_only.py "$BASE_SHA" "$HEAD_SHA"
